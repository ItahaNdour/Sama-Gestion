<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sama Gestion - V1 Pro</title>
    <!-- Lien vers les icônes (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Lien vers votre CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-shell">
        <header class="main-header">
            <div class="user-info">
                <div class="avatar">AC</div>
                <div class="user-details">
                    <span class="user-name">Aminata C.</span>
                    <span class="status-label"><i class="fa-solid fa-wifi"></i> Mode Offline</span>
                </div>
            </div>
        </header>

        <section class="revenue-card-area">
            <div class="glass-card">
                <span class="card-title">Loyers Encaissés Ce mois</span>
                <h2 id="totalDisplay">0 CFA</h2>
                <div class="progress-track">
                    <div class="progress-bar" id="gaugeFill"></div>
                </div>
            </div>
        </section>

        <nav class="action-grid">
            <button class="action-item" onclick="handleAction('visite')">
                <div class="icon-box blue-bg"><i class="fas fa-home"></i></div>
                <span>Visite</span>
            </button>
            <button class="action-item" onclick="handleAction('etat')">
                <div class="icon-box orange-bg"><i class="fas fa-camera"></i></div>
                <span>État des Lieux</span>
            </button>
            <button class="action-item" onclick="handleAction('loyer')">
                <div class="icon-box green-bg"><i class="fas fa-wallet"></i></div>
                <span>Collecter</span>
            </button>
            <button class="action-item" onclick="handleAction('biens')">
                <div class="icon-box navy-bg"><i class="fas fa-building"></i></div>
                <span>Mes Biens</span>
            </button>
        </nav>
    </div>

    <!-- Lien vers votre JavaScript -->
    <script src="script.js"></script>
</body>
</html>
