<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sama Gestion | Dashboard V1</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font-Awesome pour les icônes professionnelles -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-wrapper">
        <!-- Barre de Statut / Header -->
        <header class="top-nav">
            <div class="brand"> 
                <span class="logo-icon">SG</span>
                <h1>Sama Gestion</h1>
            </div>
            <div class="user-info">
                <i class="fas fa-circle-check online-indicator"></i>
                <span id="userName">Aminata C.</span>
            </div>
        </header>

        <!-- Section Monitoring (Propriétaire) -->
        <section class="monitor-section">
            <div class="card revenue-card">
                <div class="card-header">
                    <span>Loyers Encaissés</span>
                    <span class="badge">Ce mois</span>
                </div>
                <div class="revenue-value" id="revenueValue">0 CFA</div>
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
            </div>
        </section>

        <!-- Grille d'Actions (Icon-Centric) -->
        <nav class="action-grid">
            <button class="action-btn" onclick="app.trigger('visite')">
                <div class="icon-wrap blue"><i class="fas fa-home"></i></div>
                <span>Visite</span>
            </button>
            <button class="action-btn" onclick="app.trigger('etat')">
                <div class="icon-wrap orange"><i class="fas fa-camera"></i></div>
                <span>État des Lieux</span>
            </button>
            <button class="action-btn" onclick="app.trigger('pay')">
                <div class="icon-wrap green"><i class="fas fa-wallet"></i></div>
                <span>Collecter</span>
            </button>
            <button class="action-btn" onclick="app.trigger('biens')">
                <div class="icon-wrap red"><i class="fas fa-list-ul"></i></div>
                <span>Mes Biens</span>
            </button>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
</html>
