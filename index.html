<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sama Gestion - Premium</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header id="app-header" style="display: none;">
        <div class="logo">Sama Gestion</div>
        <button onclick="logout()">Déconnexion</button>
    </header>

    <section id="view-login">
        <div class="login-container">
            <h1>Connexion</h1>
            <form id="form-login">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Mot de passe" required>
                <button type="submit">Se connecter</button>
            </form>
        </div>
    </section>

    <section id="view-liste" style="display: none;">
        <div class="filter-bar">
            <input type="text" id="search" placeholder="Rechercher..." oninput="filtrerEtAfficher()">
            <select id="filter-type" onchange="filtrerEtAfficher()">
                <option value="Tous">Tous types</option>
                <option value="Appartement">Appartement</option>
                <option value="Studio">Studio</option>
                <option value="Villa">Villa</option>
            </select>
        </div>
        <div id="liste-biens-container"></div>
        <button class="add-btn" onclick="naviguerVers('view-formulaire')">+</button>
    </section>

    <section id="view-formulaire" style="display: none;">
        <button onclick="naviguerVers('view-liste')">Retour</button>
        <h2>Ajouter un Mandat</h2>
        <form id="form-bien">
            <input type="text" id="nom" placeholder="Nom du bien" required>
            <select id="type"><option value="Appartement">Appartement</option><option value="Studio">Studio</option><option value="Villa">Villa</option></select>
            <input type="number" id="loyer" placeholder="Loyer (FCFA)" required>
            <input type="file" id="photoInput" accept="image/*" capture="environment">
            <button type="submit">Sauvegarder le mandat</button>
        </form>
    </section>

    <script src="script.js"></script>
</body>
</html>
