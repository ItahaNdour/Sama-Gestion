<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sama Gestion v1.1 - Mes Biens</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <!-- HEADER COMMUN -->
        <header class="main-header">
            <div class="user-info">
                <div class="avatar"><i class="fa-solid fa-user-tie"></i></div>
                <div class="user-details">
                    <span class="user-name">Gestionnaire Immo</span>
                    <span class="status-label"><i class="fa-solid fa-wifi"></i> Mode Offline</span>
                </div>
            </div>
        </header>

        <!-- VUE 1 : DASHBOARD -->
        <div id="view-dashboard">
            <section class="revenue-card-area">
                <div class="glass-card">
                    <span class="card-title">Loyers Encaissés Ce mois</span>
                    <h2 id="totalDisplay">0 CFA</h2>
                    <div class="progress-track">
                        <div class="progress-bar" id="gaugeFill"></div>
                    </div>
                </div>
            </section>

            <nav class="action-grid">
                <div class="action-item" onclick="handleAction('visite')">
                    <div class="icon-box blue-bg"><i class="fas fa-calendar-check"></i></div>
                    <span>Visite</span>
                </div>
                <div class="action-item" onclick="handleAction('etat')">
                    <div class="icon-box orange-bg"><i class="fas fa-camera-retro"></i></div>
                    <span>État des Lieux</span>
                </div>
                <div class="action-item" onclick="handleAction('loyer')">
                    <div class="icon-box green-bg"><i class="fas fa-wallet"></i></div>
                    <span>Collecter</span>
                </div>
                <div class="action-item" onclick="handleAction('biens')">
                    <div class="icon-box navy-bg"><i class="fas fa-building-user"></i></div>
                    <span>Mes Biens</span>
                </div>
            </nav>
        </div>

        <!-- VUE 2 : ÉTAT DES LIEUX -->
        <div id="view-etat" class="module-view" style="display: none;">
            <div class="module-header">
                <button onclick="showDashboard()" class="back-btn"><i class="fas fa-arrow-left"></i></button>
                <h3>Nouvel État des Lieux</h3>
            </div>
            <div class="photo-grid">
                <div class="photo-slot" onclick="simulateCamera('Entrée', this)">
                    <i class="fas fa-door-open"></i><span>Entrée</span>
                </div>
                <div class="photo-slot" onclick="simulateCamera('Salon', this)">
                    <i class="fas fa-couch"></i><span>Salon</span>
                </div>
                <div class="photo-slot" onclick="simulateCamera('Chambre', this)">
                    <i class="fas fa-bed"></i><span>Chambre</span>
                </div>
                <div class="photo-slot" onclick="simulateCamera('SDB', this)">
                    <i class="fas fa-bath"></i><span>SDB</span>
                </div>
            </div>
            <button class="validate-btn" onclick="sendWhatsAppValidation()">Valider via WhatsApp</button>
        </div>

        <!-- VUE 3 : MES BIENS -->
        <div id="view-biens" class="module-view" style="display: none;">
            <div class="module-header">
                <button onclick="showDashboard()" class="back-btn"><i class="fas fa-arrow-left"></i></button>
                <h3>Mon Parc Immobilier</h3>
            </div>
            <div id="biens-list" class="biens-container">
                <!-- Le contenu sera généré par script.js -->
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
