<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sama Gestion Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --blue: #4A69FF; --bg: #F4F7FE; --navy: #1A2B49; }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #C0C9D3; margin: 0; display: flex; justify-content: center; }
        .app-shell { width: 100%; max-width: 450px; background: var(--bg); min-height: 100vh; position: relative; padding-bottom: 80px; }
        .main-header { background: var(--blue); padding: 40px 20px 80px; border-radius: 0 0 40px 40px; color: white; }
        .revenue-card { background: white; color: var(--navy); padding: 25px; border-radius: 25px; box-shadow: 0 15px 30px rgba(0,0,0,0.1); margin: -60px auto 20px; width: 85%; text-align: center; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; }
        .menu-card { background: white; padding: 25px 10px; border-radius: 25px; text-align: center; position: relative; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .icon-circle { width: 50px; height: 50px; border-radius: 15px; background: #F8F9FF; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; font-size: 1.2rem; }
        .view { padding: 15px; display: none; }
        .section-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .back-btn { background: #E0E7FF; border: none; width: 35px; height: 35px; border-radius: 50%; color: var(--blue); cursor: pointer; }
        .form-card { background: white; padding: 20px; border-radius: 25px; margin-bottom: 15px; box-shadow: 0 5px 10px rgba(0,0,0,0.02); }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #f1f5f9; border-radius: 12px; background: #f8fafc; font-size: 14px; outline: none; }
        .btn-primary { background: var(--blue); color: white; border: none; padding: 15px; width: 100%; border-radius: 15px; font-weight: bold; cursor: pointer; }
        .tabs-container { display: flex; background: #e2e8f0; padding: 5px; border-radius: 15px; margin-bottom: 20px; }
        .tab-btn { flex: 1; border: none; padding: 10px; border-radius: 12px; font-weight: bold; color: #64748b; background: transparent; cursor: pointer; }
        .tab-btn.active { background: white; color: var(--blue); }
        .bien-gallery { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
        .bien-gallery img { width: 120px; height: 120px; object-fit: cover; border-radius: 15px; flex-shrink: 0; }
        .fab-add { position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px; border-radius: 50%; background: var(--blue); color: white; border: none; font-size: 24px; box-shadow: 0 10px 20px rgba(74,105,255,0.3); z-index: 100; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 30px; width: 85%; }
        .st-btn { flex: 1; border: none; padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .mode-pay-box { flex:1; text-align:center; background:#f1f5f9; padding:10px; border-radius:10px; cursor:pointer; border: 2px solid transparent; }
        input[type="radio"]:checked + .mode-pay-box { border-color: var(--blue); background: #e0e7ff; }
    </style>
</head>
<body>
    <div class="app-shell">
        <header class="main-header">
            <div class="header-top"><span><i class="fas fa-user-circle"></i> Gestionnaire Immo</span></div>
            <div class="revenue-card">
                <p>Ma Commission Totale</p>
                <h2 id="total-display">0 CFA</h2>
                <div style="height:8px; background:#eee; border-radius:10px; margin-top:10px;"><div id="progress-bar" style="width:0%; height:100%; background:var(--blue); border-radius:10px;"></div></div>
            </div>
        </header>

        <main id="view-dashboard" class="view" style="display:block;">
            <div class="menu-grid">
                <div class="menu-card" onclick="showView('planning')">
                    <div class="icon-circle"><i class="fas fa-calendar-alt" style="color: #4A69FF;"></i></div>
                    <span>Visite</span>
                </div>
                <div class="menu-card" onclick="showView('etat')">
                    <div class="icon-circle"><i class="fas fa-camera" style="color: #F39C12;"></i></div>
                    <span>État des Lieux</span>
                </div>
                <div class="menu-card" onclick="showView('collecte')">
                    <div class="icon-circle"><i class="fas fa-wallet" style="color: #2ECC71;"></i></div>
                    <span>Collecter</span>
                </div>
                <div class="menu-card" onclick="showView('biens')">
                    <div class="icon-circle"><i class="fas fa-city" style="color: #2C3E50;"></i></div>
                    <span>Mes Biens</span>
                </div>
            </div>
        </main>

        <section id="view-planning" class="view">
            <div class="section-header">
                <button class="back-btn" onclick="showView('dashboard')"><i class="fas fa-arrow-left"></i></button>
                <h3>Visites</h3>
            </div>
            <div class="form-card">
                <input type="text" id="p-name" placeholder="Nom du client">
                <select id="p-bien-select"></select>
                <input type="datetime-local" id="p-date">
                <button class="btn-primary" onclick="sauverVisitePro()">Programmer</button>
            </div>
            <div id="visites-list"></div>
        </section>

        <section id="view-biens" class="view">
            <div class="section-header">
                <button class="back-btn" onclick="showView('dashboard')"><i class="fas fa-arrow-left"></i></button>
                <h3>Mon Parc</h3>
            </div>
            <div class="tabs-container">
                <button class="tab-btn active" onclick="filterBiens('Disponible', event)">Disponibles</button>
                <button class="tab-btn" onclick="filterBiens('Occupé', event)">Occupés</button>
            </div>
            <div id="biens-list"></div>
            <button class="fab-add" onclick="showView('ajouter-bien')"><i class="fas fa-plus"></i></button>
        </section>

        <section id="view-collecte" class="view">
            <div class="section-header">
                <button class="back-btn" onclick="showView('dashboard')"><i class="fas fa-arrow-left"></i></button>
                <h3>Encaisser</h3>
            </div>
            <div class="form-card">
                <label>Bien Occupé :</label>
                <select id="c-bien-select" onchange="preRemplirLoyer()"></select>
                <label>Type :</label>
                <select id="c-type">
                    <option value="Loyer">Loyer Mensuel</option>
                    <option value="Caution">Caution / Dépôt</option>
                    <option value="Frais">Frais de dossier</option>
                </select>
                <input type="number" id="c-montant" placeholder="Montant CFA">
                
                <label>Mode de paiement :</label>
                <div style="display:flex; gap:8px; margin-bottom:15px;">
                    <input type="radio" name="pay-mode" id="m-wave" value="Wave" checked style="display:none">
                    <label for="m-wave" class="mode-pay-box">Wave</label>
                    <input type="radio" name="pay-mode" id="m-om" value="Orange Money" style="display:none">
                    <label for="m-om" class="mode-pay-box">OM</label>
                    <input type="radio" name="pay-mode" id="m-cash" value="Espèces" style="display:none">
                    <label for="m-cash" class="mode-pay-box">Cash</label>
                </div>
                <button class="btn-primary" onclick="validerCollecte()">Enregistrer & Reçu WhatsApp</button>
            </div>
        </section>

        <section id="view-ajouter-bien" class="view">
            <div class="section-header"><button class="back-btn" onclick="showView('biens')"><i class="fas fa-times"></i></button></div>
            <div class="form-card">
                <div class="photo-upload-area" onclick="document.getElementById('camera-input').click()" style="border:2px dashed #ccc; padding:20px; text-align:center; border-radius:20px; margin-bottom:15px;">
                    <i class="fas fa-camera"></i><p>Photos (Max 3)</p>
                    <div id="previews-container"></div>
                    <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none" onchange="previewImage(this)">
                </div>
                <select id="new-bien-type" onchange="ajusterChampsParType()">
                    <option value="Terrain">Terrain Nu</option>
                    <option value="Studio">Studio (T1)</option>
                    <option value="T2">Appartement T2</option>
                    <option value="T3">Appartement T3</option>
                    <option value="Villa">Villa</option>
                </select>
                <input type="text" id="new-bien-nom" placeholder="Nom du bien">
                <input type="text" id="new-bien-adresse" placeholder="Quartier/Adresse">
                <input type="number" id="new-bien-loyer" placeholder="Prix">
                <input type="text" id="new-bien-com" placeholder="Commission (ex: 10% ou 1 mois)">
                <button class="btn-primary" onclick="saveBienPro()">Enregistrer</button>
            </div>
        </section>

        <div id="modal-rapport" class="modal" style="display:none;">
            <div class="modal-content">
                <h4>Rapport de visite</h4>
                <div style="display:flex; gap:10px; margin-bottom:15px;">
                    <button onclick="setQualif('🔥 Chaud')" class="st-btn" style="background:#FFE5E5; color:red;">Chaud</button>
                    <button onclick="setQualif('❄️ Froid')" class="st-btn" style="background:#E5F0FF; color:blue;">Froid</button>
                </div>
                <textarea id="rapport-note" placeholder="Notes..." rows="3"></textarea>
                <button class="btn-primary" onclick="validerRapport()">Valider</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
