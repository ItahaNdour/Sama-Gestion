<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMA GESTION PRO</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <span class="logo">🏢 SAMA GESTION</span>
        <i class="fas fa-plus-circle" onclick="openModal()"></i>
    </header>

    <div class="content" id="app-root">
        </div>

    <nav class="nav-bottom">
        <div class="nav-item" onclick="loadModule('biens')"><i class="fas fa-building"></i><span>Biens</span></div>
        <div class="nav-item" onclick="loadModule('collecte')"><i class="fas fa-wallet"></i><span>Collecte</span></div>
        <div class="nav-item" onclick="loadModule('visites')"><i class="fas fa-calendar-check"></i><span>Visites</span></div>
        <div class="nav-item" onclick="loadModule('edl')"><i class="fas fa-clipboard-list"></i><span>EDL</span></div>
        <div class="nav-item" onclick="loadModule('admin')"><i class="fas fa-user-shield"></i><span>Admin</span></div>
    </nav>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span onclick="closeModal()" style="float:right">&times;</span>
            <h2 id="modal-title">Nouveau Bien</h2>
            <div id="form-content"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
