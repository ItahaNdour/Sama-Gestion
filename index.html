<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>SAMA GESTION - Biens</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <span>🏢 SAMA GESTION</span>
        <button onclick="showForm()" class="btn-add">+</button>
    </header>

    <div class="filters">
        <input type="text" id="search" placeholder="Rechercher (Quartier, Nom...)" oninput="renderBiens()">
        <select id="filter-type" onchange="renderBiens()">
            <option value="">Tous types</option>
            <option value="Appartement">Appartement</option>
            <option value="Villa">Villa</option>
            <option value="Studio">Studio</option>
        </select>
    </div>

    <div id="biens-container" class="container"></div>

    <div id="form-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <input type="text" id="nom" placeholder="Nom du bien">
            <input type="text" id="quartier" placeholder="Quartier">
            <input type="number" id="loyer" placeholder="Loyer">
            <input type="text" id="superficie" placeholder="Superficie m²">
            <input type="text" id="papier" placeholder="Type de papier (TF, Bail...)">
            <select id="type"><option value="Appartement">Appartement</option><option value="Villa">Villa</option></select>
            <input type="file" id="photo" accept="image/*">
            <button onclick="saveBien()">Enregistrer</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
