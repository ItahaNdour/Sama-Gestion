<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sama Gestion Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --blue: #4A69FF; --bg: #F4F7FE; --navy: #1A2B49; }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #C0C9D3; margin: 0; display: flex; justify-content: center; }
        
        .app-shell { width: 100%; max-width: 450px; background: var(--bg); min-height: 100vh; position: relative; overflow-x: hidden; padding-bottom: 80px; }

        /* HEADER & REVENUE */
        .main-header { background: var(--blue); padding: 40px 20px 80px; border-radius: 0 0 40px 40px; color: white; }
        .revenue-card { background: white; color: var(--navy); padding: 25px; border-radius: 25px; box-shadow: 0 15px 30px rgba(0,0,0,0.1); margin: -60px auto 20px; width: 85%; text-align: center; }
        .progress-bg { height: 8px; background: #eee; border-radius: 10px; margin-top: 10px; }
        .progress-bar { height: 100%; background: var(--blue); border-radius: 10px; }

        /* DASHBOARD GRID */
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; }
        .menu-card { background: white; padding: 25px 10px; border-radius: 25px; text-align: center; position: relative; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .icon-circle { width: 50px; height: 50px; border-radius: 15px; background: #F8F9FF; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; font-size: 1.2rem; }
        .dot { width: 8px; height: 8px; border-radius: 50%; position: absolute; top: 12px; right: 12px; }
        .blue-dot { background: var(--blue); } .orange-dot { background: #F39C12; } .green-dot { background: #2ECC71; } .navy-dot { background: var(--navy); }

        /* VIEWS & CARDS */
        .view { padding: 15px; display: none; }
        .section-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .back-btn { background: #E0E7FF; border: none; width: 35px; height: 35px; border-radius: 50%; color: var(--blue); cursor: pointer; }

        .form-card { background: white; padding: 20px; border-radius: 25px; margin-bottom: 15px; box-shadow: 0 5px 10px rgba(0,0,0,0.02); }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #f1f5f9; border-radius: 12px; background: #f8fafc; font-size: 14px; outline: none; }
        label { font-size: 0.8rem; color: #64748b; margin-left: 5px; display: block; margin-bottom: 5px; }

        /* TABS & GALLERY */
        .tabs-container { display: flex; background: #e2e8f0; padding: 5px; border-radius: 15px; margin-bottom: 20px; }
        .tab-btn { flex: 1; border: none; padding: 10px; border-radius: 12px; font-weight: bold; color: #64748b; background: transparent; cursor: pointer; }
        .tab-btn.active { background: white; color: var(--blue); }

        .bien-gallery { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 5px; }
        .bien-gallery::-webkit-scrollbar { display: none; }
        .bien-gallery img { width: 120px; height: 120px; object-fit: cover; border-radius: 15px; flex-shrink: 0; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }

        /* PHOTO UPLOAD */
        .photo-upload-area { border: 2px dashed #cbd5e1; border-radius: 20px; padding: 20px; text-align: center; color: #64748b; cursor: pointer; margin-bottom: 15px; }
        .photo-upload-area i { font-size: 1.5rem; color: var(--blue); margin-bottom: 10px; }
        #previews-container { display: flex; gap: 10px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }

        /* BUTTONS */
        .btn-primary { background: var(--blue); color: white; border: none; padding: 15px; width: 100%; border-radius: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary:active { transform: scale(0.98); opacity: 0.9; }
        .fab-add { position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px; border-radius: 50%; background: var(--blue); color: white; border: none; font-size: 24px; box-shadow: 0 10px 20px rgba(74, 105, 255, 0.3); z-index: 100; cursor: pointer; }

        /* MODALS */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 30px; width: 85%; }
        .status-options { display: flex; gap: 10px; margin-bottom: 15px; }
        .st-btn { flex: 1; border: none; padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .chaud { background: #FFE5E5; color: #FF4A4A; }
        .froid { background: #E5F0FF; color: #4A90FF; }
    </style>
</head>
<body>
    <div class="app-shell">
        <header class="main-header">
            <div class="header-top"><span><i class="fas fa-user-circle"></i> Gestionnaire Immo</span></div>
            <div class="revenue-card">
                <p>Loyers Encaissés Ce mois</p>
                <h2 id="total-display">0 CFA</h2>
                <div class="progress-bg"><div class="progress-bar" style="width: 20%;"></div></div>
            </div>
        </header>

        <main id="view-dashboard" class="view" style="display:block;">
            <div class="menu-grid">
                <div class="menu-card" onclick="showView('planning')">
                    <div class="dot blue-dot"></div>
                    <div class="icon-circle"><i class="fas fa-calendar-alt" style="color: #4A69FF;"></i></div>
                    <span>Visite</span>
                </div>
                <div class="menu-card" onclick="showView('etat')">
                    <div class="dot orange-dot"></div>
                    <div class="icon-circle"><i class="fas fa-camera" style="color: #F39C12;"></i></div>
                    <span>État des Lieux</span>
                </div>
                <div class="menu-card" onclick="showView('collecte')">
                    <div class="dot green-dot"></div>
                    <div class="icon-circle"><i class="fas fa-wallet" style="color: #2ECC71;"></i></div>
                    <span>Collecter</span>
                </div>
                <div class="menu-card" onclick="showView('biens')">
                    <div class="dot navy-dot"></div>
                    <div class="icon-circle"><i class="fas fa-city" style="color: #2C3E50;"></i></div>
                    <span>Mes Biens</span>
                </div>
            </div>
        </main>

        <section id="view-planning" class="view">
            <div class="section-header">
                <button class="back-btn" onclick="showView('dashboard')"><i class="fas fa-arrow-left"></i></button>
                <h3>Visites & Rapports</h3>
            </div>
            <div class="form-card">
                <label>Prospect :</label>
                <input type="text" id="p-name" placeholder="Nom du client">
                <label>Bien concerné :</label>
                <select id="p-bien-select"></select>
                <label>Date et Heure :</label>
                <input type="datetime-local" id="p-date">
                <button class="btn-primary" onclick="sauverVisitePro()">Programmer la visite</button>
            </div>
            <div id="visites-list"></div>
        </section>

        <section id="view-biens" class="view">
            <div class="section-header">
                <button class="back-btn" onclick="showView('dashboard')"><i class="fas fa-arrow-left"></i></button>
                <h3>Mon Parc Immobilier</h3>
            </div>
            <div class="tabs-container">
                <button class="tab-btn active" onclick="filterBiens('Disponible', event)">Disponibles</button>
                <button class="tab-btn" onclick="filterBiens('Occupé', event)">Occupés</button>
            </div>
            <div id="biens-list"></div>
            <button class="fab-add" onclick="showView('ajouter-bien')"><i class="fas fa-plus"></i></button>
        </section>

        <section id="view-ajouter-bien" class="view">
            <div class="section-header">
                <button class="back-btn" onclick="showView('biens')"><i class="fas fa-times"></i></button>
                <h3>Nouveau Bien / Terrain</h3>
            </div>
            <div class="form-card">
                <div class="photo-upload-area" onclick="document.getElementById('camera-input').click()">
                    <i class="fas fa-camera"></i>
                    <p>Prendre photos (Max 3)</p>
                    <div id="previews-container"></div>
                    <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none" onchange="previewImage(this)">
                </div>

                <label>Type d'offre :</label>
                <select id="new-bien-type" onchange="ajusterChampsParType()">
                    <option value="Terrain">Terrain Nu (Vente)</option>
                    <option value="Studio">Studio (T1)</option>
                    <option value="T2">Appartement T2</option>
                    <option value="T3">Appartement T3</option>
                    <option value="Villa">Villa / Maison</option>
                    <option value="Chambre">Chambre</option>
                </select>

                <input type="text" id="new-bien-nom" placeholder="Nom du bien (ex: Terrain 200m2)">
                <input type="text" id="new-bien-adresse" placeholder="Adresse ou Quartier">
                <input type="number" id="new-bien-loyer" placeholder="Prix de vente total (CFA)">
                <input type="text" id="new-bien-proprio" placeholder="Nom du Bailleur / Vendeur">
                <input type="text" id="new-bien-com" placeholder="Ma Commission (ex: 10% ou 1 mois)">
                
                <button class="btn-primary" onclick="saveBienPro()">Enregistrer dans le catalogue</button>
            </div>
        </section>

        <div id="modal-rapport" class="modal" style="display:none;">
            <div class="modal-content">
                <h4 style="margin-top:0">Fin de visite</h4>
                <div class="status-options">
                    <button onclick="setQualif('🔥 Chaud')" class="st-btn chaud">Chaud</button>
                    <button onclick="setQualif('❄️ Froid')" class="st-btn froid">Froid</button>
                </div>
                <textarea id="rapport-note" placeholder="Notes sur l'intérêt du client..." rows="3"></textarea>
                <button class="btn-primary" onclick="validerRapport()">Valider le Rapport</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
