<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMA GESTION - Local Storage</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <span>🏢 SAMA GESTION</span>
        <span id="header-user">👑 Créateur</span>
    </header>

    <div class="container">
        <div id="view-dashboard" class="view">
            <h1>Tableau de Bord</h1>
            <button class="btn-primary" onclick="showView('biens')">Gérer les Biens</button>
        </div>

        <div id="view-biens" class="view">
            <h2>Catalogue des Biens</h2>
            <button class="btn-primary" onclick="ajouterBien()">+ Ajouter un Bien</button>
            <div id="biens-list"></div>
        </div>
    </div>

    <nav>
        <div class="nav-item" onclick="showView('dashboard')"><i class="fas fa-home"></i><br>Accueil</div>
        <div class="nav-item" onclick="showView('biens')"><i class="fas fa-building"></i><br>Biens</div>
    </nav>

    <script src="script.js"></script>
</body>
</html>
