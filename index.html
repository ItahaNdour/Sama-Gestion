<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sama Gestion v1.6 - Stable</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <!-- HEADER ADMIN -->
        <header class="main-header" onclick="showView('profil')">
            <div class="user-info">
                <div class="avatar"><i class="fa-solid fa-user-tie"></i></div>
                <div class="user-details">
                    <span class="user-name" id="displayAdminName">Gestionnaire Immo</span>
                    <span class="status-label">Paramètres Admin <i class="fas fa-cog"></i></span>
                </div>
            </div>
        </header>

        <!-- DASHBOARD -->
        <div id="view-dashboard">
            <section class="revenue-card-area">
                <div class="glass-card">
                    <span class="card-title">Collecte Totale</span>
                    <h2 id="totalDisplay">0 CFA</h2>
                    <div class="progress-track"><div class="progress-bar" id="gaugeFill"></div></div>
                </div>
            </section>
            <nav class="action-grid">
                <div class="action-item" onclick="showView('etat')">
                    <div class="icon-box orange-bg"><i class="fas fa-clipboard-list"></i></div>
                    <span>État des Lieux</span>
                </div>
                <div class="action-item" onclick="showView('collecter')">
                    <div class="icon-box green-bg"><i class="fas fa-money-bill-wave"></i></div>
                    <span>Collecter</span>
                </div>
                <div class="action-item" onclick="showView('biens')">
                    <div class="icon-box navy-bg"><i class="fas fa-building"></i></div>
                    <span>Mes Biens</span>
                </div>
                <div class="action-item" onclick="showView('ajouter')">
                    <div class="icon-box blue-bg"><i class="fas fa-plus-circle"></i></div>
                    <span>Nouveau Bien</span>
                </div>
            </nav>
        </div>

        <!-- MODULE MES BIENS (RETOUR DU FILTRE) -->
        <div id="view-biens" class="module-view" style="display: none;">
            <div class="module-header">
                <button onclick="showView('dashboard')" class="back-btn"><i class="fas fa-arrow-left"></i></button>
                <h3>Parc Immobilier</h3>
            </div>
            <!-- BARRE DE RECHERCHE RESTAURÉE -->
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Nom ou quartier (ex: Ouakam)" oninput="filterBiens()">
            </div>
            <div id="biensList" class="biens-container"></div>
        </div>

        <!-- MODULE ÉTAT DES LIEUX (ZONES COMPLÈTES) -->
        <div id="view-etat" class="module-view" style="display: none;">
            <div class="module-header">
                <button onclick="showView('dashboard')" class="back-btn"><i class="fas fa-arrow-left"></i></button>
                <h3>Inspection</h3>
            </div>
            <div class="photo-grid">
                <div class="photo-slot" id="slot-entree" onclick="toggleZone('Entrée')">Entrée</div>
                <div class="photo-slot" id="slot-salon" onclick="toggleZone('Salon')">Salon</div>
                <div class="photo-slot" id="slot-cuisine" onclick="toggleZone('Cuisine')">Cuisine</div>
                <div class="photo-slot" id="slot-chambre1" onclick="toggleZone('Chambre 1')">Chambre 1</div>
                <div class="photo-slot" id="slot-toilette" onclick="toggleZone('Toilette')">Toilette</div>
                <div class="photo-slot" id="slot-terrasse" onclick="toggleZone('Terrasse')">Terrasse</div>
            </div>
            <div class="form-group">
                <label>Signature du locataire :</label>
                <canvas id="signature-pad"></canvas>
                <button class="small-link" onclick="clearSignature()">Effacer</button>
            </div>
            <button class="primary-btn" onclick="sendWhatsAppReport()">Envoyer Rapport</button>
        </div>

        <!-- MODULE AJOUTER (NOM + ADRESSE + LOYER) -->
        <div id="view-ajouter" class="module-view" style="display: none;">
            <div class="module-header">
                <button onclick="showView('dashboard')" class="back-btn"><i class="fas fa-arrow-left"></i></button>
                <h3>Ajouter un Bien</h3>
            </div>
            <div class="form-group">
                <label>Nom du bâtiment</label>
                <input type="text" id="addNom" placeholder="ex: Immeuble A">
                <label>Adresse / Quartier</label>
                <input type="text" id="addAdresse" placeholder="ex: Sacré-Cœur 3">
                <label>Loyer Mensuel (CFA)</label>
                <input type="number" id="addLoyer" placeholder="250000">
            </div>
            <button class="primary-btn" onclick="saveNewBien()">Enregistrer</button>
        </div>

        <!-- MODULE ADMIN -->
        <div id="view-profil" class="module-view" style="display: none;">
            <div class="module-header">
                <button onclick="showView('dashboard')" class="back-btn"><i class="fas fa-arrow-left"></i></button>
                <h3>Mon Profil</h3>
            </div>
            <div class="form-group">
                <label>Nom du Gestionnaire</label>
                <input type="text" id="adminNameInput" placeholder="Votre nom">
                <button class="primary-btn" onclick="updateAdminName()">Mettre à jour</button>
            </div>
        </div>

        <!-- MODULE COLLECTER -->
        <div id="view-collecter" class="module-view" style="display: none;">
            <div class="module-header">
                <button onclick="showView('dashboard')" class="back-btn"><i class="fas fa-arrow-left"></i></button>
                <h3>Encaisser Loyer</h3>
            </div>
            <div id="collecteList" class="biens-container"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
