<div id="view-etat" class="module-view" style="display: none;">
    <div class="module-header">
        <button onclick="showView('dashboard')" class="back-btn"><i class="fas fa-arrow-left"></i></button>
        <h3>Constat d'État des Lieux</h3>
    </div>

    <!-- Choix du bien -->
    <div class="form-group">
        <label>Logement & Locataire</label>
        <select id="etatBienSelect"></select>
    </div>

    <!-- Zones d'inspection -->
    <div class="inspection-grid">
        <div class="inspection-item">
            <span>Salon</span>
            <select id="status-salon">
                <option value="Bon">Bon état</option>
                <option value="Moyen">Moyen</option>
                <option value="Mauvais">Mauvais</option>
            </select>
        </div>
        <div class="inspection-item">
            <span>Cuisine</span>
            <select id="status-cuisine">
                <option value="Bon">Bon état</option>
                <option value="Moyen">Moyen</option>
                <option value="Mauvais">Mauvais</option>
            </select>
        </div>
        <!-- Ajoutez d'autres zones ici (Chambre, SDB, etc.) -->
    </div>

    <div class="form-group">
        <label>Observations (murs, clim, clés...)</label>
        <textarea id="etatObservations" placeholder="Détaillez les anomalies..."></textarea>
    </div>

    <div class="signature-section">
        <label>Signature Locataire</label>
        <canvas id="sig-canvas"></canvas>
        <button class="small-btn" onclick="clearSig()">Effacer</button>
    </div>

    <button class="primary-btn" onclick="preparerWhatsApp()">Générer le rapport WhatsApp</button>
</div>
