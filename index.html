<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sama Gestion - Connexion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Vue : Login -->
    <section id="view-login">
        <div class="login-container">
            <h1>Sama Gestion</h1>
            <p>Connexion sécurisée</p>
            <form id="form-login">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Mot de passe" required>
                <button type="submit">Se connecter</button>
            </form>
        </div>
    </section>

    <!-- Vue : Liste des biens -->
    <section id="view-liste" style="display: none;">
        <header>
            <h1>Mes Biens</h1>
            <button onclick="naviguerVers('view-formulaire')">+ Ajouter</button>
        </header>
        <div id="liste-biens-container"></div>
    </section>

    <!-- Vue : Formulaire d'ajout -->
    <section id="view-formulaire" style="display: none;">
        <header>
            <button onclick="naviguerVers('view-liste')">Retour</button>
            <h1>Ajouter un bien</h1>
        </header>
        <form id="form-bien">
            <input type="text" id="nom" placeholder="Nom du bien" required>
            <input type="text" id="adresse" placeholder="Adresse" required>
            <input type="text" id="type" placeholder="Type (Appartement, Villa...)" required>
            <input type="text" id="proprio" placeholder="Propriétaire" required>
            <button type="submit">Enregistrer</button>
        </form>
    </section>

    <script src="script.js"></script>
</body>
</html>
