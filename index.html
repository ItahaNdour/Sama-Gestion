<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sama Gestion - État des Lieux</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <div id="view-dashboard" class="module-view">
            <header class="main-header">
                <h1>Sama Gestion</h1>
            </header>
            <div class="action-grid">
                <div class="action-item" onclick="showView('etat')">
                    <i class="fas fa-file-signature"></i>
                    <span>État des Lieux</span>
                </div>
                </div>
        </div>

        <div id="view-etat" class="module-view" style="display: none;">
            <div class="module-header">
                <button onclick="showView('dashboard')" class="back-btn"><i class="fas fa-arrow-left"></i></button>
                <h3>Nouveau Constat</h3>
            </div>

            <div class="form-group">
                <label>Bien & Locataire</label>
                <select id="etatBienSelect">
                    <option value="Villa A - M. Diop">Villa A - M. Diop</option>
                    <option value="Appart 4 - Mme Fall">Appart 4 - Mme Fall</option>
                </select>
            </div>

            <div class="inspection-grid">
                <div class="inspection-item">
                    <span>Salon</span>
                    <select id="status-salon">
                        <option>Bon</option><option>Moyen</option><option>Mauvais</option>
                    </select>
                </div>
                <div class="inspection-item">
                    <span>Cuisine</span>
                    <select id="status-cuisine">
                        <option>Bon</option><option>Moyen</option><option>Mauvais</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Observations</label>
                <textarea id="etatObservations" placeholder="Ex: Clim OK, peinture neuve..."></textarea>
            </div>

            <div class="signature-area">
                <label>Signature du Locataire</label>
                <canvas id="sig-canvas"></canvas>
                <button class="clear-btn" onclick="clearSig()">Effacer</button>
            </div>

            <button class="whatsapp-btn" onclick="envoyerWhatsApp()">
                <i class="fab fa-whatsapp"></i> Envoyer le Rapport
            </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
