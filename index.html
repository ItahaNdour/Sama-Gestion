<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Sama Gestion - Premium</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header global -->
    <header id="app-header" style="display: none;">
        <div class="logo">Sama Gestion</div>
        <div class="user-actions">
            <span id="user-info">Profil</span>
            <button onclick="logout()">Déconnexion</button>
        </div>
    </header>

    <!-- Vue : Login -->
    <section id="view-login">
        <div class="login-container">
            <h1>Sama Gestion</h1>
            <form id="form-login">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Mot de passe" required>
                <button type="submit">Se connecter</button>
            </form>
        </div>
    </section>

    <!-- Vue : Liste des biens -->
    <section id="view-liste" style="display: none;">
        <div class="content-header">
            <h1>Mes Biens</h1>
            <button onclick="naviguerVers('view-formulaire')">+ Ajouter un bien</button>
        </div>
        <div id="liste-biens-container"></div>
    </section>

    <!-- Vue : Formulaire -->
    <section id="view-formulaire" style="display: none;">
        <button onclick="naviguerVers('view-liste')">Retour</button>
        <h2>Ajouter un bien</h2>
        <form id="form-bien">
            <input type="text" id="nom" placeholder="Nom du bien" required>
            <input type="text" id="adresse" placeholder="Adresse" required>
            <button type="submit">Enregistrer</button>
        </form>
    </section>

    <script src="script.js"></script>
</body>
</html>
