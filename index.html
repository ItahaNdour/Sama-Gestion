<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sama Gestion Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <header class="main-header">
            <div class="header-top">
                <span><i class="fas fa-user-circle"></i> Gestionnaire Immo</span>
            </div>
            <div class="revenue-card">
                <p>Loyers Encaissés Ce mois</p>
                <h2 id="total-display">0 CFA</h2>
                <div class="progress-container"><div class="progress-bar" id="main-progress"></div></div>
            </div>
        </header>

        <main id="view-dashboard" class="view">
            <div class="menu-grid">
                <div class="menu-card" onclick="showView('planning')">
                    <div class="icon-circle blue"><i class="fas fa-calendar-alt"></i></div>
                    <span>Visite</span>
                </div>
                <div class="menu-card" onclick="showView('etat')">
                    <div class="icon-circle orange"><i class="fas fa-camera"></i></div>
                    <span>État des Lieux</span>
                </div>
                <div class="menu-card" onclick="showView('collecte')">
                    <div class="icon-circle green"><i class="fas fa-wallet"></i></div>
                    <span>Collecter</span>
                </div>
                <div class="menu-card" onclick="showView('biens')">
                    <div class="icon-circle navy"><i class="fas fa-city"></i></div>
                    <span>Mes Biens</span>
                </div>
            </div>
        </main>

        <section id="view-planning" class="view" style="display:none;">
            <div class="section-header">
                <button class="back-btn" onclick="showView('dashboard')"><i class="fas fa-arrow-left"></i></button>
                <h3>Planning Visites</h3>
            </div>
            
            <div class="form-card">
                <div class="input-group">
                    <label>Nom du visiteur</label>
                    <input type="text" id="p-name" placeholder="Ex: M. Diop">
                </div>
                <div class="input-group">
                    <label>Téléphone</label>
                    <input type="tel" id="p-phone" placeholder="77 000 00 00">
                </div>
                <div class="input-group">
                    <label>Bien à visiter</label>
                    <select id="p-bien-select"></select>
                </div>
                <div class="input-group">
                    <label>Date et Heure</label>
                    <input type="datetime-local" id="p-date" class="full-date-input">
                </div>
                <button class="btn-save" onclick="sauverVisitePro()">Programmer la visite</button>
            </div>

            <div class="list-container" id="visites-list"></div>
        </section>

        <section id="view-biens" class="view" style="display:none;">
            <div class="section-header">
                <button onclick="showView('dashboard')"><i class="fas fa-arrow-left"></i></button>
                <h3>Mon Parc Immobilier</h3>
            </div>
            <div id="biens-list" class="list-container"></div>
            <button class="fab-add" onclick="showView('ajouter-bien')"><i class="fas fa-plus"></i></button>
        </section>

        <section id="view-ajouter-bien" class="view" style="display:none;">
            <div class="section-header">
                <button onclick="showView('biens')"><i class="fas fa-times"></i></button>
                <h3>Nouveau Bien</h3>
            </div>
            <div class="form-card">
                <input type="text" id="new-bien-nom" placeholder="Nom du bien">
                <input type="text" id="new-bien-locataire" placeholder="Nom du Locataire">
                <input type="number" id="new-bien-loyer" placeholder="Loyer (CFA)">
                <button class="btn-save" onclick="saveBien()">Enregistrer</button>
            </div>
        </section>

        <section id="view-etat" class="view" style="display:none;">
            <div class="section-header">
                <button onclick="showView('dashboard')"><i class="fas fa-arrow-left"></i></button>
                <h3>État des Lieux</h3>
            </div>
            <div id="pieces-container"></div>
            <div class="form-card">
                <canvas id="sig-canvas"></canvas>
                <button class="btn-wa" onclick="sendWA()"><i class="fab fa-whatsapp"></i> Envoyer Rapport</button>
            </div>
        </section>

        <section id="view-collecte" class="view" style="display:none;">
            <div class="section-header">
                <button onclick="showView('dashboard')"><i class="fas fa-arrow-left"></i></button>
                <h3>Encaisser Loyer</h3>
            </div>
            <div id="collecte-list"></div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
