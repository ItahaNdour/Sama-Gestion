<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sama Gestion Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <header class="main-header">
            <div class="header-top"><span><i class="fas fa-user-circle"></i> Gestionnaire Immo</span></div>
            <div class="revenue-card">
                <p>Total Encaissé ce mois</p>
                <h2 id="total-display">0 CFA</h2>
                <div class="progress-container"><div class="progress-bar" id="main-progress"></div></div>
            </div>
        </header>

        <main id="view-dashboard" class="view">
            <div class="menu-grid">
                <div class="menu-card" onclick="showView('planning')">
                    <div class="icon-circle blue"><i class="fas fa-calendar-alt"></i></div>
                    <span>Visite</span>
                </div>
                <div class="menu-card" onclick="showView('etat')">
                    <div class="icon-circle orange"><i class="fas fa-camera"></i></div>
                    <span>État des Lieux</span>
                </div>
                <div class="menu-card" onclick="showView('collecte')">
                    <div class="icon-circle green"><i class="fas fa-wallet"></i></div>
                    <span>Collecter</span>
                </div>
                <div class="menu-card" onclick="showView('biens')">
                    <div class="icon-circle navy"><i class="fas fa-city"></i></div>
                    <span>Mes Biens</span>
                </div>
            </div>
        </main>

        <section id="view-biens" class="view" style="display:none;">
            <div class="section-header">
                <button class="back-btn" onclick="showView('dashboard')"><i class="fas fa-arrow-left"></i></button>
                <h3>Mon Parc Immobilier</h3>
            </div>
            <div class="tabs-container">
                <button class="tab-btn active" onclick="filterBiens('Disponible', event)">Disponibles</button>
                <button class="tab-btn" onclick="filterBiens('Occupé', event)">Occupés</button>
            </div>
            <div id="biens-list"></div>
            <button class="fab-add" onclick="showView('ajouter-bien')"><i class="fas fa-plus"></i></button>
        </section>

        <section id="view-ajouter-bien" class="view" style="display:none;">
            <div class="section-header">
                <button class="back-btn" onclick="showView('biens')"><i class="fas fa-times"></i></button>
                <h3>Nouveau Bien</h3>
            </div>
            <div class="form-card">
                <label class="field-label">Nom du bien / Immeuble</label>
                <input type="text" id="new-bien-nom" placeholder="Ex: Résidence Horizon">
                
                <label class="field-label">Quartier</label>
                <input type="text" id="new-bien-quartier" placeholder="Ex: Almadies, Ngor...">

                <div style="display:flex; gap:10px;">
                    <div style="flex:1">
                        <label class="field-label">Type</label>
                        <select id="new-bien-type">
                            <option value="Studio (T1)">Studio (T1)</option>
                            <option value="T2">T2 (Ch+S)</option>
                            <option value="T3">T3 (2Ch+S)</option>
                            <option value="T4">T4 (3Ch+S)</option>
                            <option value="Villa">Villa</option>
                        </select>
                    </div>
                    <div style="flex:1">
                        <label class="field-label">Étage</label>
                        <select id="new-bien-etage">
                            <option value="RDC">RDC</option>
                            <option value="1er">1er</option>
                            <option value="2ème">2ème</option>
                            <option value="3ème+">3ème+</option>
                        </select>
                    </div>
                </div>

                <label class="field-label">Loyer mensuel (CFA)</label>
                <input type="number" id="new-bien-loyer" placeholder="Ex: 350000">

                <label class="field-label">Commodités</label>
                <div class="check-grid">
                    <label><input type="checkbox" id="check-clim"> ❄️ Clim</label>
                    <label><input type="checkbox" id="check-parking"> 🅿️ Parking</label>
                    <label><input type="checkbox" id="check-jardin"> 🌳 Jardin</label>
                    <label><input type="checkbox" id="check-gardien"> 🛡️ Gardien</label>
                </div>

                <label class="field-label">Lien Google Maps (Optionnel)</label>
                <input type="text" id="new-bien-maps" placeholder="Coller le lien ici">

                <label class="field-label">Bailleur / Propriétaire</label>
                <input type="text" id="new-bien-proprio" placeholder="Nom du proprio">

                <button class="btn-save" onclick="saveBienPro()">Enregistrer le bien</button>
            </div>
        </section>

        <section id="view-planning" class="view" style="display:none;">
            <div class="section-header"><button class="back-btn" onclick="showView('dashboard')"><i class="fas fa-arrow-left"></i></button><h3>Visites</h3></div>
            <div class="form-card">
                <input type="text" id="p-name" placeholder="Nom prospect">
                <select id="p-bien-select"></select>
                <input type="datetime-local" id="p-date">
                <button class="btn-save" onclick="sauverVisitePro()">Programmer</button>
            </div>
            <div id="visites-list"></div>
        </section>

        <div id="modal-rapport" class="modal" style="display:none;">
            <div class="modal-content">
                <h4>Rapport de visite</h4>
                <div class="status-options">
                    <button onclick="setClientStatus('chaud')" class="st-btn chaud" id="btn-chaud">🔥 Chaud</button>
                    <button onclick="setClientStatus('froid')" class="st-btn froid" id="btn-froid">❄️ Froid</button>
                </div>
                <textarea id="rapport-note" placeholder="Notes..."></textarea>
                <button class="btn-save" onclick="validerRapport()">Valider</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
