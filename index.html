<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMA GESTION PRO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #1E293B; --accent: #D97706; --bg: #F1F5F9; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding-bottom: 70px; }
        
        /* Header */
        header { background: var(--primary); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        
        /* Layout */
        .container { padding: 15px; }
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        /* Navigation */
        .nav-bottom { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #ddd; }
        .nav-item { text-align: center; font-size: 10px; color: #64748B; cursor: pointer; }
        
        /* Formulaire */
        .btn-add { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <span>🏢 SAMA GESTION</span>
    </header>

    <div class="container">
        <h2>Gestion des Biens</h2>
        <button class="btn-add" onclick="alert('Formulaire d'ajout')">+ Nouveau Bien</button>
        
        <div id="biens-list" style="margin-top: 20px;">
            </div>
    </div>

    <nav class="nav-bottom">
        <div class="nav-item"><i class="fas fa-building"></i><br>Biens</div>
        <div class="nav-item"><i class="fas fa-wallet"></i><br>Collecte</div>
        <div class="nav-item"><i class="fas fa-calendar-check"></i><br>Visites</div>
        <div class="nav-item"><i class="fas fa-clipboard-list"></i><br>EDL</div>
        <div class="nav-item"><i class="fas fa-user-shield"></i><br>Admin</div>
    </nav>
</body>
</html>
