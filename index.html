<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sama Gestion Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <header class="main-header">
            <div class="header-top"><span><i class="fas fa-user-circle"></i> Gestionnaire Immo</span></div>
            <div class="revenue-card">
                <p>Loyers Encaissés Ce mois</p>
                <h2 id="total-display">0 CFA</h2>
                <div class="progress-container"><div class="progress-bar" style="width:35%"></div></div>
            </div>
        </header>

        <main id="view-dashboard" class="view">
            <div class="menu-grid">
                <div class="menu-card" onclick="showView('planning')">
                    <div class="icon-circle blue"><i class="fas fa-calendar-alt"></i></div>
                    <span>Visite</span>
                </div>
                <div class="menu-card" onclick="showView('etat')">
                    <div class="icon-circle orange"><i class="fas fa-camera"></i></div>
                    <span>État des Lieux</span>
                </div>
                <div class="menu-card" onclick="showView('collecte')">
                    <div class="icon-circle green"><i class="fas fa-wallet"></i></div>
                    <span>Collecter</span>
                </div>
                <div class="menu-card" onclick="showView('biens')">
                    <div class="icon-circle navy"><i class="fas fa-city"></i></div>
                    <span>Mes Biens</span>
                </div>
            </div>
        </main>

        <section id="view-planning" class="view" style="display:none;">
            <div class="section-header">
                <button class="back-btn" onclick="showView('dashboard')"><i class="fas fa-arrow-left"></i></button>
                <h3>Visites & Rapports</h3>
            </div>
            
            <div class="form-card">
                <input type="text" id="p-name" placeholder="Nom du prospect">
                <input type="tel" id="p-phone" placeholder="Téléphone (ex: 221...)">
                <select id="p-bien-select"></select>
                <input type="datetime-local" id="p-date">
                <button class="btn-save" onclick="sauverVisitePro()">Programmer</button>
            </div>

            <div id="visites-list"></div>
        </section>

        <div id="modal-rapport" class="modal" style="display:none;">
            <div class="modal-content">
                <h4>Rapport de visite</h4>
                <p id="rapport-client-name"></p>
                <div class="status-options">
                    <button onclick="setClientStatus('chaud')" class="st-btn chaud">🔥 Chaud</button>
                    <button onclick="setClientStatus('relancer')" class="st-btn relancer">⏳ À relancer</button>
                    <button onclick="setClientStatus('froid')" class="st-btn froid">❄️ Froid</button>
                </div>
                <textarea id="rapport-note" placeholder="Notes (ex: Prêt à signer lundi)"></textarea>
                <button class="btn-save" onclick="validerRapport()">Enregistrer Rapport</button>
            </div>
        </div>

        <section id="view-biens" class="view" style="display:none;">
            <div class="section-header"><button onclick="showView('dashboard')" class="back-btn">←</button><h3>Mes Biens</h3></div>
            <div id="biens-list"></div>
            <button class="fab-add" onclick="showView('ajouter-bien')">+</button>
        </section>

        <section id="view-ajouter-bien" class="view" style="display:none;">
            <div class="section-header"><button onclick="showView('biens')" class="back-btn">←</button><h3>Nouveau Bien</h3></div>
            <div class="form-card">
                <input type="text" id="new-bien-nom" placeholder="Nom du bien">
                <input type="number" id="new-bien-loyer" placeholder="Loyer">
                <button class="btn-save" onclick="saveBien()">Enregistrer</button>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
