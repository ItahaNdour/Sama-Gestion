<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAMA GESTION PRO</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #F8FAFC; --surface: #FFFFFF; --dark: #0F172A; --text: #334155; --text-light: #64748B;
            --gold: #D97706; --gold-light: #FEF3C7; --border: #E2E8F0; --green: #10B981; --red: #EF4444;
            --radius: 10px; --shadow: 0 2px 4px rgb(0 0 0 / 0.04);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background: var(--bg); color: var(--text); padding-bottom: 80px; font-size: 13px; }
        .container { max-width: 480px; margin: 0 auto; padding: 12px 10px; }
        
        header { background: var(--surface); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .user-badge { background: var(--bg); border: 1px solid var(--border); padding: 4px 8px; border-radius: 20px; font-weight: 600; font-size: 0.75rem; display: flex; align-items: center; gap: 4px; }
        
        .view { display: none; animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        h2 { font-weight: 800; font-size: 1.15rem; color: var(--dark); margin-bottom: 10px; }
        h3 { font-weight: 700; font-size: 0.95rem; margin-bottom: 8px; }
        
        .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; box-shadow: var(--shadow); margin-bottom: 10px; }
        label { display: block; font-size: 0.7rem; font-weight: 700; color: var(--text-light); text-transform: uppercase; margin-bottom: 4px; }
        
        input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--border); background: var(--bg); border-radius: 6px; font-size: 0.85rem; font-weight: 500; margin-bottom: 10px; outline: none; }
        button { width: 100%; padding: 10px; border-radius: 6px; border: none; font-size: 0.85rem; font-weight: 700; cursor:pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        
        .btn-primary { background: var(--dark); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        
        .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
        .tab-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text-light); padding: 6px; font-size: 0.75rem; border-radius: 6px; font-weight: 600; }
        .tab-btn.active { background: var(--gold-light); color: var(--gold); border-color: var(--gold); }
        
        .bien-gallery { display: flex; gap: 4px; overflow-x: auto; margin-bottom: 4px; }
        .bien-gallery img { width: 45px; height: 35px; border-radius: 4px; object-fit: cover; }
        
        .kpi-card { background: var(--surface); border: 1px solid var(--border); padding: 12px; border-radius: var(--radius); text-align: center; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        
        nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: var(--dark); display: flex; justify-content: space-around; align-items: center; z-index: 999; }
        .nav-item { color: #94A3B8; display: flex; flex-direction: column; align-items: center; font-size: 0.65rem; font-weight: 600; gap: 2px; background: none; border: none; width: auto; padding: 0; }
        .nav-item i { font-size: 1.1rem; }
        .nav-item.active { color: #FFFFFF; }
        
        .modal { position: fixed; inset: 0; background: rgba(15,23,42,0.5); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 10px; }
        .modal-content { background: var(--surface); width: 100%; max-width: 380px; border-radius: var(--radius); padding: 15px; max-height: 80vh; overflow-y: auto; }
        
        .payment-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
        .payment-selector label { background: white; border: 1px solid var(--border); padding: 8px; border-radius: 6px; text-align: center; font-weight: 600; text-transform: none; font-size: 0.8rem; margin: 0; }
        .payment-selector input[type="radio"] { display: none; }
        .payment-selector input[type="radio"]:checked + label { background: var(--gold-light); border-color: var(--gold); color: var(--gold); }
    </style>
</head>
<body>

    <div id="login-screen" style="position: fixed; inset: 0; background: var(--dark); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 15px;">
        <div class="login-card" style="background: var(--surface); width: 100%; max-width: 340px; padding: 20px; border-radius: var(--radius); text-align: center;">
            <h3>SAMA GESTION</h3>
            <p style="color: var(--text-light); font-size: 0.75rem; margin-bottom: 15px;">V9.6 • Version Compacte Connectée</p>
            <input type="email" id="login-username" placeholder="Email professionnel">
            <input type="password" id="login-password" placeholder="Mot de passe / Code PIN">
            <p id="login-error" style="color: var(--red); font-size: 0.75rem; margin-bottom: 10px; display: none;"></p>
            <button class="btn-primary" onclick="verifierConnexion()">Se connecter</button>
        </div>
    </div>

    <header>
        <span style="font-weight: 800; font-size: 0.95rem;">SAMA GESTION 💼</span>
        <div id="header-user-badge" class="user-badge">...</div>
    </header>

    <div class="container">

        <div id="view-dashboard" class="view">
            <h2><i class="fas fa-chart-pie" style="color:var(--gold);"></i> Vue d'ensemble</h2>
            
            <div id="morning-alerts-box" class="form-card" style="display:none; background: #FFF5F5; border: 1px solid #FEB2B2; padding: 10px; margin-bottom: 10px;">
                <h3 style="color: #C53030; font-size: 0.85rem; margin-bottom: 6px;"><i class="fas fa-bell"></i> Alertes & Échéances du jour</h3>
                <div id="morning-alerts-list" style="display: flex; flex-direction: column; gap: 6px;"></div>
            </div>

            <div class="kpi-card" style="margin-bottom: 10px; background: var(--dark); color: white; padding: 15px;">
                <small style="font-size: 0.65rem; opacity: 0.7; font-weight: 700;">COMMISSIONS ENCAISSÉES</small>
                <h1 id="total-display" style="font-size: 1.6rem; color: #FFF; margin-top: 2px;">0 CFA</h1>
            </div>
            <div class="grid-2">
                <button class="btn-outline" style="background: white; flex-direction: column; padding: 12px;" onclick="ouvrirFormulaireAjout()">
                    <i class="fas fa-plus-circle" style="font-size: 1.2rem; color: var(--gold); margin-bottom: 4px;"></i>
                    <span style="font-size: 0.75rem;">Ajouter un bien</span>
                </button>
                <button class="btn-outline" style="background: white; flex-direction: column; padding: 12px;" onclick="resetNavStyles(document.querySelectorAll('.nav-item')[2]); showView('collecte')">
                    <i class="fas fa-wallet" style="font-size: 1.2rem; color: #10B981; margin-bottom: 4px;"></i>
                    <span style="font-size: 0.75rem;">Encaissement</span>
                </button>
            </div>
        </div>

        <div id="view-biens" class="view">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <h2><i class="fas fa-building" style="color:var(--gold);"></i> Catalogue Biens</h2>
                <button class="btn-primary" style="width:auto; padding:6px 10px; font-size:0.75rem; background:var(--gold);" onclick="ouvrirFormulaireAjout()">
                    <i class="fas fa-plus"></i> Nouveau Bien
                </button>
            </div>
            <input type="text" id="search-bien-input" placeholder="🔍 Filtrer par nom ou quartier..." oninput="renderBiens()">
            <div class="tabs">
                <button class="tab-btn active" onclick="filterBiens('Disponible', event)">🟢 Dispo</button>
                <button class="tab-btn" onclick="filterBiens('Occupé', event)">🔴 Loué</button>
            </div>
            <div id="biens-list"></div>
        </div>

        <div id="view-ajouter-bien" class="view">
            <h2 id="form-bien-title">Nouveau Bien</h2>
            <input type="hidden" id="edit-bien-id">
            <div class="form-card">
                <label>Nom du bien *</label>
                <input type="text" id="new-bien-nom" placeholder="Ex: Studio A2 Almadies">
                <label>Type</label>
                <select id="new-bien-type">
                    <option value="Appartement">🏢 Appartement</option><option value="Chambre">🛏️ Chambre</option>
                    <option value="Studio">🏠 Studio</option><option value="Magasin">🏪 Magasin</option><option value="Terrain">📐 Terrain</option>
                </select>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <div>
                        <label>📐 Superficie</label>
                        <input type="text" id="new-bien-superficie" placeholder="Ex: 150 m2">
                    </div>
                    <div>
                        <label>📄 Papier juridique</label>
                        <select id="new-bien-papier">
                            <option value="Non spécifié">Non spécifié</option><option value="Titre Foncier">Titre Foncier</option>
                            <option value="Bail">Bail</option><option value="Attestation">Attestation</option><option value="Délibération">Délibération</option>
                        </select>
                    </div>
                </div>
                <label>Prix de vente / Loyer (CFA) *</label>
                <input type="number" id="new-bien-loyer" oninput="calculerProrataAutomatique()">
                <label>Quartier / Adresse</label>
                <input type="text" id="new-bien-adresse" placeholder="Ex: Dakar, Ngor">
                <label>Honoraires / Com</label>
                <input type="text" id="new-bien-com" value="10%">
                <label>Propriétaire</label>
                <input type="text" id="new-bien-proprio" placeholder="Nom du propriétaire">
                <label>Téléphone Proprio</label>
                <input type="tel" id="new-bien-proprio-tel" placeholder="Ex: 77XXXXXXX">

                <div id="edit-only-fields" style="display:none; border-top:1px dashed var(--border); padding-top:10px;">
                    <label>Locataire actuel</label>
                    <input type="text" id="edit-bien-locataire">
                    <label>Téléphone Locataire</label>
                    <input type="tel" id="edit-bien-locataire-tel">
                    <label>Date d'entrée</label>
                    <input type="date" id="edit-bien-date-entree" onchange="calculerProrataAutomatique()">
                    <div id="prorata-box" style="display:none; background:var(--gold-light); padding:6px; font-size:0.75rem; color:#9A3412; margin-bottom:10px;"><p id="prorata-result"></p></div>
                </div>

                <label>Photos (Max 3)</label>
                <input type="file" accept="image/*" multiple onchange="previewAndCompressImage(this, 'bien')" style="padding:4px; font-size:0.75rem;">
                <div id="previews-container" class="bien-gallery"></div>
                
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
                    <button class="btn-outline" onclick="showView('biens')">Annuler</button>
                    <button class="btn-primary" id="btn-save-bien" onclick="saveBienPro()">Enregistrer</button>
                </div>
            </div>
        </div>

        <div id="view-collecte" class="view">
            <h2><i class="fas fa-cash-register" style="color:#10B981;"></i> Flux Caisse</h2>
            <div class="form-card">
                <label>Bien occupé</label>
                <select id="c-bien-select" onchange="analyserReliquatComptable()"></select>
                <label>Nature</label>
                <select id="c-type" onchange="analyserReliquatComptable()">
                    <option value="Loyer">Loyer</option><option value="Caution">Caution (Dépôt)</option><option value="Prorata">Prorata</option><option value="Avance">Avance</option>
                </select>
                <label>Montant (CFA)</label>
                <input type="number" id="c-montant">
                <label>Mode de paiement</label>
                <div class="payment-selector">
                    <input type="radio" name="pay-mode" id="m-espece" value="Espèces" checked><label for="m-es
