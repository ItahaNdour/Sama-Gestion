<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sama Gestion PRO - Final</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <!-- HEADER -->
        <header class="main-header">
            <div class="user-info">
                <div class="avatar"><i class="fa-solid fa-user-tie"></i></div>
                <div class="user-details">
                    <span class="user-name">Gestionnaire Immo</span>
                    <span class="status-label">Mode Expert</span>
                </div>
            </div>
        </header>

        <!-- DASHBOARD -->
        <div id="view-dashboard">
            <section class="revenue-card-area">
                <div class="glass-card">
                    <span class="card-title">Collecte Totale</span>
                    <h2 id="totalDisplay">0 CFA</h2>
                    <div class="progress-track"><div class="progress-bar" id="gaugeFill"></div></div>
                </div>
            </section>
            <nav class="action-grid">
                <div class="action-item" onclick="showView('etat')">
                    <div class="icon-box orange-bg"><i class="fas fa-camera-retro"></i></div>
                    <span>État des Lieux</span>
                </div>
                <div class="action-item" onclick="showView('collecter')">
                    <div class="icon-box green-bg"><i class="fas fa-wallet"></i></div>
                    <span>Collecter</span>
                </div>
                <div class="action-item" onclick="showView('biens')">
                    <div class="icon-box navy-bg"><i class="fas fa-building-user"></i></div>
                    <span>Mes Biens</span>
                </div>
                <div class="action-item" onclick="showView('ajouter')">
                    <div class="icon-box blue-bg"><i class="fas fa-plus-circle"></i></div>
                    <span>Ajouter</span>
                </div>
            </nav>
        </div>

        <!-- MODULE ÉTAT DES LIEUX + SIGNATURE -->
        <div id="view-etat" class="module-view" style="display: none;">
            <div class="module-header">
                <button onclick="showView('dashboard')" class="back-btn"><i class="fas fa-arrow-left"></i></button>
                <h3>Inspection & Signature</h3>
            </div>
            <div class="photo-grid">
                <div class="photo-slot" id="slot-entree" onclick="toggleZone('Entrée')">Entrée</div>
                <div class="photo-slot" id="slot-salon" onclick="toggleZone('Salon')">Salon</div>
            </div>
            <div class="form-group">
                <label>Signature du locataire :</label>
                <canvas id="signature-pad"></canvas>
                <button class="small-btn" onclick="clearSignature()">Effacer signature</button>
            </div>
            <button class="primary-btn" onclick="sendWhatsAppReport()">Signer et Envoyer</button>
        </div>

        <!-- MODULE MES BIENS + SUPPRESSION -->
        <div id="view-biens" class="module-view" style="display: none;">
            <div class="module-header">
                <button onclick="showView('dashboard')" class="back-btn"><i class="fas fa-arrow-left"></i></button>
                <h3>Mon Parc Immobilier</h3>
            </div>
            <div id="biensList" class="biens-container"></div>
        </div>

        <!-- VUE AJOUTER -->
        <div id="view-ajouter" class="module-view" style="display: none;">
            <div class="module-header">
                <button onclick="showView('dashboard')" class="back-btn"><i class="fas fa-arrow-left"></i></button>
                <h3>Nouveau Bien</h3>
            </div>
            <div class="form-group">
                <input type="text" id="addNom" placeholder="Nom du bien">
                <input type="number" id="addLoyer" placeholder="Loyer (CFA)">
            </div>
            <button class="primary-btn" onclick="saveNewBien()">Enregistrer</button>
        </div>

        <!-- VUE COLLECTER -->
        <div id="view-collecter" class="module-view" style="display: none;">
            <div class="module-header">
                <button onclick="showView('dashboard')" class="back-btn"><i class="fas fa-arrow-left"></i></button>
                <h3>Collecter</h3>
            </div>
            <div id="collecteList" class="biens-container"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
