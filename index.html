<!-- VUE ÉTAT DES LIEUX COMPLET -->
<div id="view-etat" class="module-view" style="display: none;">
    <div class="module-header">
        <button onclick="showDashboard()" class="back-btn"><i class="fas fa-arrow-left"></i></button>
        <h3>Rapport d'État des Lieux</h3>
    </div>
    
    <div class="photo-grid">
        <div class="photo-slot" id="slot-entree" onclick="togglePhoto('Entrée')">
            <i class="fas fa-door-open"></i><span>Entrée</span>
        </div>
        <div class="photo-slot" id="slot-salon" onclick="togglePhoto('Salon')">
            <i class="fas fa-couch"></i><span>Salon</span>
        </div>
        <div class="photo-slot" id="slot-chambre" onclick="togglePhoto('Chambre')">
            <i class="fas fa-bed"></i><span>Chambre</span>
        </div>
        <div class="photo-slot" id="slot-sdb" onclick="togglePhoto('SDB')">
            <i class="fas fa-bath"></i><span>SDB</span>
        </div>
    </div>

    <div class="notes-area">
        <label>Observations particulières :</label>
        <textarea id="etat-notes" placeholder="Ex: Rayures sur le parquet du salon..."></textarea>
    </div>

    <button class="validate-btn" onclick="genererRapportWhatsApp()">
        <i class="fab fa-whatsapp"></i> Envoyer le Rapport
    </button>
</div>
