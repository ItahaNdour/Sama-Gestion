<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sama Gestion Pro v1.4</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <header class="main-header">
            <div class="user-info">
                <div class="avatar"><i class="fa-solid fa-user-tie"></i></div>
                <div class="user-details">
                    <span class="user-name">Gestionnaire Immo</span>
                    <span class="status-label"><i class="fa-solid fa-wifi"></i> Mode Local</span>
                </div>
            </div>
        </header>

        <!-- VUE 1 : DASHBOARD -->
        <div id="view-dashboard">
            <section class="revenue-card-area">
                <div class="glass-card">
                    <span class="card-title">Loyers Encaissés</span>
                    <h2 id="totalDisplay">0 CFA</h2>
                    <div class="progress-track"><div class="progress-bar" id="gaugeFill"></div></div>
                </div>
            </section>
            <nav class="action-grid">
                <div class="action-item" onclick="showView('etat')">
                    <div class="icon-box orange-bg"><i class="fas fa-camera-retro"></i></div>
                    <span>État des Lieux</span>
                </div>
                <div class="action-item" onclick="showView('collecter')">
                    <div class="icon-box green-bg"><i class="fas fa-wallet"></i></div>
                    <span>Collecter</span>
                </div>
                <div class="action-item" onclick="showView('biens')">
                    <div class="icon-box navy-bg"><i class="fas fa-building-user"></i></div>
                    <span>Mes Biens</span>
                </div>
                <div class="action-item" onclick="showView('ajouter')">
                    <div class="icon-box blue-bg"><i class="fas fa-plus-circle"></i></div>
                    <span>Nouveau Bien</span>
                </div>
            </nav>
        </div>

        <!-- VUE 2 : ÉTAT DES LIEUX COMPLET -->
        <div id="view-etat" class="module-view" style="display: none;">
            <div class="module-header">
                <button onclick="showView('dashboard')" class="back-btn"><i class="fas fa-arrow-left"></i></button>
                <h3>Rapport d'Inspection</h3>
            </div>
            <div class="photo-grid">
                <div class="photo-slot" id="slot-entree" onclick="toggleZone('Entrée')"><i class="fas fa-door-open"></i><span>Entrée</span></div>
                <div class="photo-slot" id="slot-salon" onclick="toggleZone('Salon')"><i class="fas fa-couch"></i><span>Salon</span></div>
                <div class="photo-slot" id="slot-chambre" onclick="toggleZone('Chambre')"><i class="fas fa-bed"></i><span>Chambre</span></div>
                <div class="photo-slot" id="slot-sdb" onclick="toggleZone('SDB')"><i class="fas fa-bath"></i><span>SDB</span></div>
            </div>
            <div class="form-group">
                <label>Observations (Dégâts, travaux...)</label>
                <textarea id="etatNotes" placeholder="Décrivez l'état ici..."></textarea>
            </div>
            <button class="primary-btn" onclick="sendWhatsAppReport()">Envoyer le Rapport</button>
        </div>

        <!-- VUE 3 : LISTE DES BIENS -->
        <div id="view-biens" class="module-view" style="display: none;">
            <div class="module-header">
                <button onclick="showView('dashboard')" class="back-btn"><i class="fas fa-arrow-left"></i></button>
                <h3>Mon Parc Immobilier</h3>
            </div>
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Rechercher..." oninput="filterBiens()">
            </div>
            <div id="biensList" class="biens-container"></div>
        </div>

        <!-- VUE 4 : AJOUTER UN BIEN -->
        <div id="view-ajouter" class="module-view" style="display: none;">
            <div class="module-header">
                <button onclick="showView('dashboard')" class="back-btn"><i class="fas fa-arrow-left"></i></button>
                <h3>Nouveau Bâtiment</h3>
            </div>
            <div class="form-group">
                <label>Nom du bien</label>
                <input type="text" id="addNom" placeholder="ex: Villa Sunshine">
                <label>Adresse</label>
                <input type="text" id="addAdresse" placeholder="ex: Almadies">
                <label>Loyer Mensuel (CFA)</label>
                <input type="number" id="addLoyer" placeholder="500000">
            </div>
            <button class="primary-btn" onclick="saveNewBien()">Enregistrer le bien</button>
        </div>

        <!-- VUE 5 : COLLECTER -->
        <div id="view-collecter" class="module-view" style="display: none;">
            <div class="module-header">
                <button onclick="showView('dashboard')" class="back-btn"><i class="fas fa-arrow-left"></i></button>
                <h3>Encaisser Loyer</h3>
            </div>
            <div id="collecteList" class="biens-container"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
